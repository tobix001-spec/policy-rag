[project]
name = "policyrag"
version = "0.1.0"
description = "Production-style RAG over policy, claims and support documents — fully local (Ollama + bge + FAISS)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-text-splitters>=0.3",
    "sentence-transformers>=3.0",
    "torch>=2.7",
    "faiss-cpu>=1.9",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
ui = ["streamlit>=1.38", "pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyrag"]

# CUDA 12.8 wheels: the RTX 5070 (Blackwell, sm_120) needs cu128 or newer.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
